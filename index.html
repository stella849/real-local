<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real Local — 그곳에 사는 사람들이 소개하는 한국</title>
<meta name="description" content="인증된 로컬이 직접 만든 한국의 맛집·동네 지도. 지도 9개, 장소 133곳.">
<meta name="theme-color" content="#fff8e0">

<meta property="og:title" content="Real Local">
<meta property="og:description" content="인증된 로컬이 직접 만든 한국의 맛집·동네 지도.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23fff8e0'/><circle cx='16' cy='13' r='4.5' fill='%231f1f1f'/><path d='M16 19v7' stroke='%231f1f1f' stroke-width='2.4' stroke-linecap='round'/></svg>">
</head>
<body>

<!-- 손그림 펜 — 반듯한 벡터 선을 흔들어 손으로 그은 선으로 만든다.
     한 번만 정의하고 장식용 SVG가 filter="url(#pen)"으로 참조한다. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <filter id="pen" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pen-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="shell">
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view" tabindex="-1"></main>

  <div class="stripe" aria-hidden="true"></div>
  <footer class="footer">
    <p><b>Real Local</b> — 인증된 로컬이 만든 지도.</p>
    <p class="muted" id="footer-stats"></p>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/app.js" type="module"></script>
</body>
</html>
