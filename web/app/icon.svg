<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Real Local">
  <!--
    낙관(도장). 시안 C·Hanok 의 단청 적색은 큰 면적이 아니라 작은 곳에
    찍히는 색이고, 파비콘이 정확히 그 자리다.

    안쪽은 지도 핀을 파냈다 — 도장 + 핀은 '승인된 큐레이터가 만든 지도'
    라는 제품 정의를 16px 에서 읽히는 최소 형태로 옮긴 것이다.
    핀 하나만 두면 여느 지도 앱과 구분되지 않는다.

    글자를 쓰지 않은 이유: 파비콘에는 폰트가 보장되지 않고, 16px 에서
    로마자 두 글자는 뭉갠다.

    그라디언트·글로우 없음 (§10.1).
  -->
  <rect width="32" height="32" rx="7" fill="#AA4649"/>
  <path fill="#FAF5EA" fill-rule="evenodd" d="
    M16 6.5c-4.14 0-7.5 3.36-7.5 7.5 0 5.6 7.5 11.5 7.5 11.5S23.5 19.6 23.5 14c0-4.14-3.36-7.5-7.5-7.5z
    M16 11.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z
  "/>
</svg>
